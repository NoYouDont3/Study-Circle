<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Circle</title>
<meta name="theme-color" content="#ff5a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Circle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-190.png">
<link href="https://fonts.googleapis.com/css2?family=Bakbak+One&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #ff4400 0%, #ffbb51 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px 80px;
    font-family: "Bakbak One", sans-serif;
  }

  .title {
    font-size: clamp(48px, 10vw, 96px);
    text-align: center;
    line-height: 1;
    display: flex;
    gap: 0.2em;
  }

  .title .study {
    color: #ffffff;
  }

  .title .circle-wrap {
    position: relative;
    display: inline-block;
  }

  .title .circle-wrap::before {
    content: "";
    position: absolute;
    inset: -6px -14px;
    background: #ffffff;
    z-index: 0;
  }

  .title .circle {
    position: relative;
    color: #434343;
    z-index: 1;
  }

  .tagline {
    margin-top: 36px;
    color: #ffffff;
    font-weight: bold;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(20px, 4vw, 32px);
    text-align: center;
  }

  .icon {
    margin-top: 48px;
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 32px;
    border: 8px solid #ffffff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  .features {
    margin-top: 32px;
    list-style: none;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(16px, 3vw, 20px);
    font-weight: bold;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
  }

  .features li {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .features li::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffffff;
    flex-shrink: 0;
  }

  .get-app {
    margin-top: 36px;
    color: #ffffff;
    font-size: clamp(22px, 4vw, 30px);
    text-align: center;
  }

  .btn-row {
    margin-top: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .install-btn {
    background: #1e6fff;
    color: #ffffff;
    font-family: "Bakbak One", sans-serif;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    padding: 14px 44px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .install-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(0,0,0,0.3);
  }

  .install-btn:active {
    transform: translateY(0);
  }

  .help-btn {
    background: #ff5fa2;
    color: #ffffff;
    font-family: "Bakbak One", sans-serif;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    padding: 14px 44px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .help-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(0,0,0,0.3);
  }

  .help-btn:active {
    transform: translateY(0);
  }
</style>
</head>

  <div class="get-app">GET THE APP!!!!!</div>

  <div class="btn-row">
    <button class="install-btn" id="installButton" type="button">INSTALL</button>
    <button class="help-btn" onclick="window.location.href='study-circle.html'">Desktop</button>
  </div>

  <script>
    let installPrompt;
    const installButton = document.getElementById('installButton');
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

    if (isStandalone) installButton.hidden = true;

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      installPrompt = event;
    });

    installButton.addEventListener('click', async () => {
      if (installPrompt) {
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        return;
      }

      if (isIos) {
        alert('To install Study Circle, tap Share in Safari, then choose “Add to Home Screen.”');
      } else {
        alert('Install becomes available after this site is opened over HTTPS or localhost in a supported browser.');
      }
    });

    window.addEventListener('appinstalled', () => {
      installButton.hidden = true;
      installPrompt = null;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
    }
  </script>
